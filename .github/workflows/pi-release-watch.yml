name: Pi release watch

# Once a day, check whether Pi's latest release is one the package has been tested on.
# For a new release, try the package on it and open one issue per version with the result.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pi-release-watch

jobs:
  watch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Compare Pi's latest release with the tested versions
        id: pi
        run: |
          latest="$(npm view @earendil-works/pi-coding-agent dist-tags.latest)"
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version string: $latest" >&2
            exit 1
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          if node scripts/pi-gate.mjs has "$latest"; then
            echo "Pi $latest is already tested."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Look for an issue about this version
        if: steps.pi.outputs.new == 'true'
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          PI_VERSION: ${{ steps.pi.outputs.version }}
        run: |
          count="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title \"Pi $PI_VERSION released\"" --json number --jq length)"
          if [ "$count" -gt 0 ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.pi.outputs.new == 'true' && steps.issue.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Try the package on the new Pi
        if: steps.pi.outputs.new == 'true' && steps.issue.outputs.exists == 'false'
        id: trial
        continue-on-error: true
        env:
          PI_VERSION: ${{ steps.pi.outputs.version }}
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pi" "@earendil-works/pi-coding-agent@$PI_VERSION"
          node scripts/pi-gate.mjs add "$PI_VERSION"
          npm test
          python3 test/e2e.py --pi "$RUNNER_TEMP/pi/bin/pi" --output "$RUNNER_TEMP/e2e"

      - name: Open an issue
        if: steps.pi.outputs.new == 'true' && steps.issue.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PI_VERSION: ${{ steps.pi.outputs.version }}
          OUTCOME: ${{ steps.trial.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            result="With $PI_VERSION added to the version gate, the unit tests and the end-to-end scenarios passed."
          else
            result="With $PI_VERSION added to the version gate, the unit tests or the end-to-end scenarios failed."
          fi
          body="$(printf '%s\n\n%s\n\nRun: %s\n' \
            "Pi $PI_VERSION is the latest release on npm. The package enables its model picker only on the Pi versions it was tested on. On $PI_VERSION, \`/model\` lists Panda models only after \`/login panda\` until a release adds this version." \
            "$result" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Pi $PI_VERSION released" --body "$body"
